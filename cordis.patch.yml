# glm-quota 插件包：插入 Host 半边（额度查询服务 + Remote 端点）。
# Client 半边（浏览器里的额度徽标）由 package.json 的 dsh.client 声明。
- insert:
    - id: glm-quota
      name: '@YueZeyi/dsh-glm-quota'
      config:
        # 凭据引用名（= provider 配置里的 apiKeyEnv），按顺序取第一个已配置的。
        # 走 Harness 自己的凭据通道：进程环境 或 $DSH_HOME/.credentials.yaml。
        apiKeyEnv:
          - ZAI_CODING_CN_API_KEY
          - ZHIPU_API_KEY
        cacheTtlMs: 60000
        timeoutMs: 15000
        # 只有当前模型属于这些 provider 时才显示徽标（键 = llm-pi-ai 的 provider id）。
        providers:
          - zai-coding-cn
        # provider 对不上时的兜底：模型 id 含这些子串也算。
        models:
          - glm
